name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Check platform signing keys
        id: keys
        env:
          PLATFORM_PK8_B64: ${{ secrets.PLATFORM_PK8_B64 }}
          PLATFORM_CERT_B64: ${{ secrets.PLATFORM_CERT_B64 }}
        run: |
          if [ -n "$PLATFORM_PK8_B64" ] && [ -n "$PLATFORM_CERT_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Platform signing keys not available (e.g. fork PR) — launcher will be debug-signed and SerialBridge left unsigned"
          fi

      # Only needed when we can't platform-sign: gradle then signs the launcher with this key
      - name: Create debug keystore
        if: steps.keys.outputs.available != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build all Android modules
        run: ./gradlew assembleRelease --no-daemon ${{ steps.keys.outputs.available == 'true' && '-PunsignedRelease' || '' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Platform-sign VeloLauncher and FreewheelBridge
        if: steps.keys.outputs.available == 'true'
        env:
          PLATFORM_PK8_B64: ${{ secrets.PLATFORM_PK8_B64 }}
          PLATFORM_CERT_B64: ${{ secrets.PLATFORM_CERT_B64 }}
        run: |
          scripts/ci-platform-sign.sh \
            launcher/build/outputs/apk/release/launcher-release-unsigned.apk \
            launcher/build/outputs/apk/velolauncher.apk \
            freewheelbridge/build/outputs/apk/release/freewheelbridge-release-unsigned.apk \
            freewheelbridge/build/outputs/apk/freewheelbridge.apk

      - name: Build standalone JARs
        run: ./gradlew :ucblib:buildClassesJar :velofit:buildClassesJar --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ -f launcher/build/outputs/apk/velolauncher.apk ]; then
            cp launcher/build/outputs/apk/velolauncher.apk artifacts/velolauncher.apk
          else
            cp launcher/build/outputs/apk/release/launcher-release.apk artifacts/velolauncher-debugsigned.apk
          fi

          if [ -f freewheelbridge/build/outputs/apk/freewheelbridge.apk ]; then
            cp freewheelbridge/build/outputs/apk/freewheelbridge.apk artifacts/serialbridge.apk
          else
            cp freewheelbridge/build/outputs/apk/release/freewheelbridge-release-unsigned.apk artifacts/serialbridge-unsigned.apk
          fi

          cp ucblib/build/libs/ucblib.jar artifacts/
          cp velofit/build/libs/velofit.jar artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/
          retention-days: 30
