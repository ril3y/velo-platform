name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe versioning

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The launcher is built unsigned and signed below with the platform key, so every
      # release carries the same certificate (in-app updates need a stable signer).
      - name: Build all Android modules (release)
        run: ./gradlew assembleRelease -PunsignedRelease --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Platform-sign VeloLauncher and FreewheelBridge
        env:
          PLATFORM_PK8_B64: ${{ secrets.PLATFORM_PK8_B64 }}
          PLATFORM_CERT_B64: ${{ secrets.PLATFORM_CERT_B64 }}
        run: |
          if [ -z "$PLATFORM_PK8_B64" ] || [ -z "$PLATFORM_CERT_B64" ]; then
            echo "::error::Platform signing keys required for release builds"
            exit 1
          fi
          scripts/ci-platform-sign.sh \
            launcher/build/outputs/apk/release/launcher-release-unsigned.apk \
            launcher/build/outputs/apk/velolauncher.apk \
            freewheelbridge/build/outputs/apk/release/freewheelbridge-release-unsigned.apk \
            freewheelbridge/build/outputs/apk/freewheelbridge.apk

      - name: Build standalone JARs
        run: ./gradlew :ucblib:buildClassesJar :velofit:buildClassesJar --no-daemon

      - name: Collect release artifacts
        run: |
          mkdir -p release
          cp launcher/build/outputs/apk/velolauncher.apk release/velolauncher.apk
          cp freewheelbridge/build/outputs/apk/freewheelbridge.apk release/serialbridge.apk
          cp ucblib/build/libs/ucblib.jar release/
          cp velofit/build/libs/velofit.jar release/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes

      # Hand-written notes in docs/release-notes/<tag>.md (if present) go above the
      # auto-generated changelog.
      - name: Find release notes
        id: notes
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "No $NOTES — using generated release notes only"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/velolauncher.apk
            release/serialbridge.apk
            release/ucblib.jar
            release/velofit.jar
